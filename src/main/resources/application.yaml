spring:
  application:
    name: car-booking-service
    instance-id: "${spring.application.name}:${random.uuid}"
  profiles:
    default: local
  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: car-booking-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            key:
              delegate:
                class: org.apache.kafka.common.serialization.StringDeserializer
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
          json:
            trusted:
              packages: com.velocitymotors.carbooking.model.event
            value:
              default:
                type: com.velocitymotors.carbooking.model.event.BankTransferPaymentEventRequest
credit-card-validation:
  base-url: http://localhost:9090/host/credit-card-payment-api
  connect-timeout: 5s
  read-timeout: 8s
bank-transfer:
  payment-events-topic: bank-transfer-payment-events
booking:
  cancellation:
    fixed-delay-ms: 60000
    minutes: 2880
    batch-size: 100
server:
  port: 8080
logging:
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.kafka: INFO
    com.velocitymotors.carbooking: INFO
  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/${spring.application.name}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
resilience4j:
  retry:
    instances:
      creditCardValidation:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions: com.velocitymotors.carbooking.service.adapter.outbound.http.CreditCardValidationUnavailableException
  circuitbreaker:
    instances:
      creditCardValidation:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions: com.velocitymotors.carbooking.service.adapter.outbound.http.CreditCardValidationUnavailableException
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # DB_CLOSE_DELAY=-1 keeps the in-memory DB alive when the pool has no open connections
    url: "jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true